<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Painel de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9ECEE;
    --card:#FFFFFF;
    --ink:#16212B;
    --muted:#647380;
    --line:#CDD5DB;
    --petrol:#0B6E8C;
    --petrol-d:#095267;
    --red:#DA3633;
    --green:#2B8A3E;
    --amber:#E8850C;
    --violet:#6A45D1;
    --shadow:0 1px 2px rgba(22,33,43,.08),0 6px 20px rgba(22,33,43,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--paper);color:var(--ink);
    max-width:480px;margin:0 auto;min-height:100vh;
    padding-bottom:110px;
  }
  h1,h2,h3,.disp{font-family:'Archivo','Inter',sans-serif;letter-spacing:-.01em}

  /* Header / gauge */
  header{
    background:linear-gradient(160deg,var(--petrol),var(--petrol-d));
    color:#fff;padding:20px 18px 22px;border-radius:0 0 22px 22px;
    position:relative;overflow:hidden;
  }
  header::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
    border:14px solid rgba(255,255,255,.06);border-radius:50%}
  .hd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .hd-date{font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:600}
  .hd-title{font-size:26px;font-weight:800;margin:2px 0 0;line-height:1.05}
  .gauge{display:flex;align-items:center;gap:14px;margin-top:18px}
  .ring{position:relative;width:76px;height:76px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-num b{font-family:'Archivo';font-size:22px;line-height:1}
  .ring-num span{font-size:10px;opacity:.8;letter-spacing:.05em}
  .gauge-txt b{font-family:'Archivo';font-size:15px;font-weight:700;display:block}
  .gauge-txt span{font-size:13px;opacity:.85}

  /* Filters */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on[data-c="all"]{background:var(--ink)}
  .chip.on[data-c="Comercial"]{background:var(--petrol)}
  .chip.on[data-c="Produção"]{background:var(--amber)}
  .chip.on[data-c="Pessoal"]{background:var(--violet)}
  .chip.on[data-c="Financeiro"]{background:var(--green)}

  /* Periods */
  main{padding:6px 14px 0}
  .period{margin-top:14px}
  .period-hd{display:flex;align-items:center;gap:9px;padding:6px 6px 8px}
  .period-hd .ic{width:22px;height:22px;flex:0 0 auto;color:var(--muted)}
  .period-hd h2{font-size:15px;font-weight:700;margin:0;flex:1}
  .period-hd .cnt{font-size:12px;color:var(--muted);font-weight:600;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

  /* Task row */
  .task{display:flex;align-items:flex-start;gap:12px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:13px 13px 13px 0;
    margin-bottom:9px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .task .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .bar[data-c="Comercial"]{background:var(--petrol)}
  .bar[data-c="Produção"]{background:var(--amber)}
  .bar[data-c="Pessoal"]{background:var(--violet)}
  .bar[data-c="Financeiro"]{background:var(--green)}
  .check{margin-left:16px;flex:0 0 auto;width:26px;height:26px;border-radius:8px;
    border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:.15s;margin-top:1px}
  .check svg{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.5);transition:.15s}
  .task.done .check{background:var(--green);border-color:var(--green)}
  .task.done .check svg{opacity:1;transform:scale(1)}
  .t-body{flex:1;min-width:0}
  .t-title{font-size:15px;font-weight:500;line-height:1.3;word-break:break-word}
  .task.done .t-title{color:var(--muted);text-decoration:line-through}
  .t-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;color:#fff}
  .tag[data-c="Comercial"]{background:var(--petrol)}
  .tag[data-c="Produção"]{background:var(--amber)}
  .tag[data-c="Pessoal"]{background:var(--violet)}
  .tag[data-c="Financeiro"]{background:var(--green)}
  .t-time{font-size:12px;color:var(--muted);font-weight:600;font-family:'Archivo'}
  .t-rec{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
  .t-rec svg{width:12px;height:12px}
  .t-del{flex:0 0 auto;color:var(--line);background:none;border:none;cursor:pointer;
    padding:4px;margin-top:-2px}
  .t-del:active{color:var(--red)}

  /* Empty */
  .empty{text-align:center;color:var(--muted);padding:50px 24px}
  .empty svg{width:44px;height:44px;color:var(--line);margin-bottom:10px}
  .empty p{margin:0;font-size:14px}

  /* FAB */
  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(calc(-50% + 172px));
    width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;border:none;
    font-size:30px;cursor:pointer;box-shadow:0 6px 18px rgba(218,54,51,.4);z-index:30;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .fab:active{transform:translateX(calc(-50% + 172px)) scale(.92)}
  @media(max-width:480px){.fab{transform:translateX(0);right:20px;left:auto}
    .fab:active{transform:scale(.92)}}

  /* Sheet */
  .backdrop{position:fixed;inset:0;background:rgba(22,33,43,.5);z-index:40;opacity:0;
    pointer-events:none;transition:.2s}
  .backdrop.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);
    bottom:0;width:100%;max-width:480px;background:var(--paper);z-index:50;
    border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .sheet.on{transform:translateX(-50%) translateY(0)}
  .sheet h3{margin:0 0 16px;font-size:18px;font-weight:700}
  .grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .field input[type=text],.field input[type=time]{width:100%;padding:13px;border:1px solid var(--line);
    border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--petrol)}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1;min-width:0;text-align:center;padding:11px 6px;border:1px solid var(--line);
    border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);transition:.12s}
  .opt.on{color:#fff;border-color:transparent;background:var(--ink)}
  .opt[data-c="Comercial"].on{background:var(--petrol)}
  .opt[data-c="Produção"].on{background:var(--amber)}
  .opt[data-c="Pessoal"].on{background:var(--violet)}
  .opt[data-c="Financeiro"].on{background:var(--green)}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .rec-toggle{display:flex;align-items:center;justify-content:space-between;
    padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
  .rec-toggle span{font-size:14px;font-weight:500}
  .rec-toggle small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
  .switch.on{background:var(--green)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
    border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on::after{left:21px}
  .save{width:100%;padding:15px;background:var(--petrol);color:#fff;border:none;
    border-radius:13px;font-size:16px;font-weight:700;font-family:'Archivo';cursor:pointer;margin-top:4px}
  .save:active{background:var(--petrol-d)}
  .save:disabled{opacity:.5}

  .loading{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <div class="hd-top">
      <div>
        <div class="hd-date" id="date">—</div>
        <h1 class="hd-title">Painel de Tarefas</h1>
      </div>
    </div>
    <div class="gauge">
      <div class="ring">
        <svg width="76" height="76" viewBox="0 0 76 76">
          <circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="8"/>
          <circle id="ring-fg" cx="38" cy="38" r="32" fill="none" stroke="#fff" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201"/>
        </svg>
        <div class="ring-num"><b id="ring-pct">0%</b><span>hoje</span></div>
      </div>
      <div class="gauge-txt">
        <b id="gauge-count">0 de 0</b>
        <span id="gauge-msg">Nenhuma tarefa ainda</span>
      </div>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <main id="main"><div class="loading">Carregando…</div></main>

  <button class="fab" id="fab" aria-label="Nova tarefa">+</button>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <h3 id="sheet-title">Nova tarefa</h3>
    <div class="field">
      <label>O que precisa fazer</label>
      <input type="text" id="f-title" placeholder="Ex: Ligar para o comprador da usina" autocomplete="off">
    </div>
    <div class="field">
      <label>Categoria</label>
      <div class="opts" id="f-cat">
        <div class="opt" data-c="Comercial">Comercial</div>
        <div class="opt" data-c="Produção">Produção</div>
        <div class="opt" data-c="Pessoal">Pessoal</div>
        <div class="opt" data-c="Financeiro">Financeiro</div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Período</label>
        <div class="opts" id="f-period" style="flex-direction:column">
          <div class="opt" data-p="manha">Manhã</div>
          <div class="opt" data-p="tarde">Tarde</div>
          <div class="opt" data-p="noite">Noite</div>
        </div>
      </div>
      <div class="field">
        <label>Horário (opcional)</label>
        <input type="time" id="f-time">
      </div>
    </div>
    <div class="field">
      <div class="rec-toggle" id="rec-toggle">
        <span>Tarefa de rotina<small>Repete todo dia e reseta sozinha</small></span>
        <div class="switch" id="f-rec"></div>
      </div>
    </div>
    <button class="save" id="save">Salvar tarefa</button>
  </div>

<script>
const KEY='painel-tarefas:v1';
const CATS=['Comercial','Produção','Pessoal','Financeiro'];
const PERIODS=[
  {id:'manha',label:'Manhã',ic:'<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6L4.5 4.5M19.5 19.5L18 18M18 6l1.5-1.5M4.5 19.5L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>'},
  {id:'tarde',label:'Tarde',ic:'<path d="M17 18a5 5 0 0 0-10 0M12 2v3M4.2 10.2L2.5 8.5M19.8 10.2l1.7-1.7M3 18h18M4 22h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>'},
  {id:'noite',label:'Noite',ic:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>'}
];
const CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const REC_IC='<svg viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TRASH='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let tasks=[];
let filter='all';
let form={cat:null,period:null,rec:false};

const $=id=>document.getElementById(id);
const todayStr=()=>new Date().toISOString().slice(0,10);

async function load(){
  try{
    const raw=localStorage.getItem(KEY);
    const data=raw?JSON.parse(raw):{tasks:[],lastReset:todayStr()};
    tasks=data.tasks||[];
    // Reset recurring tasks on a new day
    if(data.lastReset!==todayStr()){
      tasks.forEach(t=>{if(t.rec)t.done=false});
      await save();
    }
  }catch(e){
    tasks=[];
  }
  render();
}
async function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({tasks,lastReset:todayStr()}));
  }catch(e){console.error('save falhou',e)}
}

function fmtDate(){
  const d=new Date();
  const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return dias[d.getDay()]+', '+d.getDate()+' '+meses[d.getMonth()];
}

function renderFilters(){
  const f=$('filters');
  const all=[{c:'all',l:'Todas'}].concat(CATS.map(c=>({c,l:c})));
  f.innerHTML=all.map(x=>
    `<div class="chip ${filter===x.c?'on':''}" data-c="${x.c}">${x.l}</div>`).join('');
  f.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filter=ch.dataset.c;render()});
}

function render(){
  $('date').textContent=fmtDate();
  renderFilters();
  const shown=tasks.filter(t=>filter==='all'||t.cat===filter);
  const done=shown.filter(t=>t.done).length;
  const total=shown.length;
  const pct=total?Math.round(done/total*100):0;
  $('ring-pct').textContent=pct+'%';
  $('ring-fg').style.strokeDashoffset=201-(201*pct/100);
  $('gauge-count').textContent=done+' de '+total;
  $('gauge-msg').textContent=total===0?'Tudo limpo por aqui':
    done===total?'Tudo feito. Manda bem!':(total-done)+' pendente'+(total-done>1?'s':'');

  const main=$('main');
  if(total===0){
    main.innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Nenhuma tarefa${filter!=='all'?' em '+filter:''}.<br>Toque no + para adicionar.</p></div>`;
    return;
  }
  let html='';
  PERIODS.forEach(p=>{
    let items=shown.filter(t=>t.period===p.id);
    items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    if(!items.length)return;
    const pdone=items.filter(t=>t.done).length;
    html+=`<section class="period"><div class="period-hd">
      <svg class="ic" viewBox="0 0 24 24" fill="none">${p.ic}</svg>
      <h2>${p.label}</h2><div class="cnt">${pdone}/${items.length}</div></div>`;
    items.forEach(t=>{
      html+=`<div class="task ${t.done?'done':''}" data-id="${t.id}">
        <div class="bar" data-c="${t.cat}"></div>
        <div class="check" data-id="${t.id}">${CHECK}</div>
        <div class="t-body">
          <div class="t-title">${esc(t.title)}</div>
          <div class="t-meta">
            <span class="tag" data-c="${t.cat}">${t.cat}</span>
            ${t.time?`<span class="t-time">${t.time}</span>`:''}
            ${t.rec?`<span class="t-rec">${REC_IC}rotina</span>`:''}
          </div>
        </div>
        <button class="t-del" data-del="${t.id}">${TRASH}</button>
      </div>`;
    });
    html+='</section>';
  });
  main.innerHTML=html;
  main.querySelectorAll('.check').forEach(c=>c.onclick=()=>toggle(c.dataset.id));
  main.querySelectorAll('.t-del').forEach(b=>b.onclick=()=>del(b.dataset.del));
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function toggle(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;await save();render();
}
async function del(id){
  tasks=tasks.filter(x=>x.id!==id);await save();render();
}

// Sheet
function openSheet(){
  form={cat:null,period:null,rec:false};
  $('f-title').value='';$('f-time').value='';
  $('f-rec').classList.remove('on');
  document.querySelectorAll('#f-cat .opt,#f-period .opt').forEach(o=>o.classList.remove('on'));
  updateSave();
  $('backdrop').classList.add('on');$('sheet').classList.add('on');
}
function closeSheet(){$('backdrop').classList.remove('on');$('sheet').classList.remove('on')}
function updateSave(){
  $('save').disabled=!($('f-title').value.trim()&&form.cat&&form.period);
}
$('fab').onclick=openSheet;
$('backdrop').onclick=closeSheet;
$('f-title').oninput=updateSave;
document.querySelectorAll('#f-cat .opt').forEach(o=>o.onclick=()=>{
  form.cat=o.dataset.c;
  document.querySelectorAll('#f-cat .opt').forEach(x=>x.classList.remove('on'));
  o.classList.add('on');updateSave();
});
document.querySelectorAll('#f-period .opt').forEach(o=>o.onclick=()=>{
  form.period=o.dataset.p;
  document.querySelectorAll('#f-period .opt').forEach(x=>x.classList.remove('on'));
  o.classList.add('on');updateSave();
});
$('rec-toggle').onclick=()=>{form.rec=!form.rec;$('f-rec').classList.toggle('on',form.rec)};
$('save').onclick=async()=>{
  const title=$('f-title').value.trim();
  if(!title||!form.cat||!form.period)return;
  tasks.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),
    title,cat:form.cat,period:form.period,time:$('f-time').value||'',rec:form.rec,done:false});
  await save();closeSheet();render();
};

load();
</script>
</body>
</html>
